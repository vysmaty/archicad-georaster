name: Archicad Add-On build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:

jobs:
  python-quality:
    name: Python quality and repository contracts
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Synchronize locked environment
        run: uv sync --all-groups --locked
      - name: Ruff formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type check
        run: uv run ty check tools tests
      - name: Structural tests
        run: uv run pytest

  build:
    name: AC${{ matrix.version }} ${{ matrix.configuration }} ${{ matrix.language }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 27
            configuration: Debug
            language: CZE
          - version: 27
            configuration: Release
            language: CZE
          - version: 28
            configuration: Debug
            language: CZE
          - version: 28
            configuration: Release
            language: CZE
          - version: 29
            configuration: Debug
            language: CZE
          - version: 29
            configuration: Release
            language: CZE
          - version: 29
            configuration: Debug
            language: INT
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Report Visual Studio toolchains
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
      - name: Download pinned DevKit
        shell: pwsh
        run: .\tools\bootstrap.ps1 -Version ${{ matrix.version }}
      - name: Configure and build
        shell: pwsh
        env:
          GRAPHISOFT_DEVELOPER_ID: ${{ secrets.GRAPHISOFT_DEVELOPER_ID }}
          GRAPHISOFT_LOCAL_ID: ${{ secrets.GRAPHISOFT_LOCAL_ID }}
        run: .\tools\build.ps1 -Version ${{ matrix.version }} -Configuration ${{ matrix.configuration }} -Language ${{ matrix.language }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: GeoRaster-AC${{ matrix.version }}-${{ matrix.configuration }}-${{ matrix.language }}
          path: build/**/GeoRaster.apx
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-quality, build]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Check out tagged source for release notes
        uses: actions/checkout@v7.0.1
      - name: Download AC27 CZE Release Add-On
        uses: actions/download-artifact@v5
        with:
          name: GeoRaster-AC27-Release-CZE
          path: release/AC27
      - name: Download AC28 CZE Release Add-On
        uses: actions/download-artifact@v5
        with:
          name: GeoRaster-AC28-Release-CZE
          path: release/AC28
      - name: Download AC29 CZE Release Add-On
        uses: actions/download-artifact@v5
        with:
          name: GeoRaster-AC29-Release-CZE
          path: release/AC29
      - name: Assemble release assets
        shell: pwsh
        run: |
          foreach ($version in 27, 28, 29) {
            $artifact = Get-ChildItem -Path "release/AC$version" -Filter GeoRaster.apx -Recurse |
              Select-Object -First 1
            if ($null -eq $artifact) {
              throw "GeoRaster AC$version CZE Release artifact was not found."
            }
            Copy-Item $artifact.FullName "release/GeoRaster-AC$version-Release-CZE.apx"
          }
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref_name }}" -notmatch "^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$") {
            throw "Release tags must use vX.Y.Z or vX.Y.Z-prerelease format."
          }
          $assets = Get-ChildItem -Path release -Filter "GeoRaster-AC*-Release-CZE.apx" |
            ForEach-Object { $_.FullName }
          if ($assets.Count -ne 3) {
            throw "Expected three CZE Release assets, found $($assets.Count)."
          }
          $arguments = @("${{ github.ref_name }}", "--generate-notes")
          if ("${{ github.ref_name }}" -match "-") {
            $arguments += "--prerelease"
          }
          $arguments += $assets
          gh release create @arguments
